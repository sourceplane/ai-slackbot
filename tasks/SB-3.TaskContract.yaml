apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: SB-3
  title: "ai-slackbot becomes an Orun baseline"
spec:
  goal: blueprint.yaml and repo-blueprint.yaml take a new Slack bot from nothing to live on stage and prod in one landing, held by Baseline CI
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - .baseline
    - .github/workflows/baseline.yml
    - .github/workflows/tag.yml
    - ai/context
    - docs/phases
    - hooks
    - testing
    - tooling/rebrand
    - tooling/bootstrap
    - tooling/catalog
    - apps/api/docs
    - tests/api/docs
    - specs/epics/ai-slackbot
    - README.md
  doneWhen:
    - every Baseline CI tier is green
    - a bot placed from it carries the bot only, branded, with the template's licence and policy intact
  gates: []
