name: Baseline CI

# THE FACTORY'S OWN LANES — this repository tested as a BASELINE: that its
# build document parses with the orun a bootstrap actually runs, that its card
# agrees with it, that every component is placed by exactly one phase, that a
# placed tree comes up branded and carrying nothing of the factory, and that
# the API it produces installs, builds, deploys (dry) and serves.
#
# ─── WHY THIS IS NOT IN ci.yml ────────────────────────────────────────────
#
# `repo-blueprint.yaml`'s `github-workflows` module copies the WHOLE `.github`
# directory into every API built from this repository. These jobs run
# `testing/*.sh`, and `testing/` is deliberately not placed — so in a product
# they would be steps that cannot pass, red on its very first pull request. This
# file is in the blueprint's `ignore` list, and `testing/coverage.test.sh`
# fails on any workflow that reads `testing/` and is not.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: baseline-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Tier 0. bash, python3 and git; node for the tools. No workspace install,
  # no network, no credential — the job that most certainly fails a PR.
  baseline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node v5 turns on the pnpm cache by itself when package.json
          # names a packageManager, and then fails on a runner with no pnpm.
          # This job installs nothing.
          package-manager-cache: false
      - name: Contract tests (manifest, phases, coverage, rebrand, retouch, bootstrap-defer)
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          for t in manifest phases coverage rebrand retouch bootstrap-defer; do
            echo "── $t"
            bash "testing/$t.test.sh"
          done
      # Every component's docs/{overview,architecture,runbook}.md is generated
      # from what the component declares (its manifest, Worker config,
      # Terraform, migrations, package scripts). A pull request that changes
      # one of those facts without regenerating the pages fails here.
      - name: Component docs match their manifests
        run: python3 tooling/catalog/gen-component-docs.py --check

  # Tier 1. THE BLUEPRINT, READ AND PLACED BY THE BINARY A BOOTSTRAP RUNS.
  #
  # Pinned at the bootstrap floor (BOOTSTRAP.md), not the API's lane pin:
  # every test here reads YAML with PyYAML, which parses anything well-formed;
  # only the pinned orun can say whether the document is one a bootstrap can
  # run. `--status` parses it, validates every hook against the action
  # registry, compiles every `when` and narration template, and writes
  # nothing. Then the leak gate (what an API would carry, and what its files
  # say) and the placement tier (the offline bootstrap: both phases placed and
  # finished by the blueprint's own hooks, then the API's own `orun plan` for
  # the push that merges 01-product).
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.88.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Nothing in this job installs (the offline bootstrap runs no pnpm
          # since the lockfile hook went), so there is no pnpm store to
          # cache — and setup-node v5's own pnpm cache, on by itself because
          # package.json names a packageManager, fails the job in its post
          # step when it finds none.
          package-manager-cache: false
      - name: repo-blueprint.yaml, read by the pinned CLI
        run: |
          set -euo pipefail
          orun --version
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          # Required inputs must be supplied for the document to resolve; the
          # values are arbitrary and nothing is written.
          orun new --blueprint repo-blueprint.yaml --status \
            --out "$(mktemp -d)" \
            --set reponame=acme-api \
            --set "productname=Acme API" \
            --set githuborg=acme-inc
      - name: the leak gate — what an API carries
        run: bash testing/leak.test.sh
      - name: placement — the offline bootstrap, and the API's own plan
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name "baseline ci"
          bash testing/placement.test.sh

  # Tier 2. THE API IT PRODUCES WORKS: both landings installed, their
  # fixtures rendered, type-checked, linted, tested and built, every run step
  # of the stage lane's pull-request plan (the structure check before any
  # build, the build, the typecheck, the dry deploy) in the job tree orun
  # stages, and the Worker served by `wrangler dev --env stage` and
  # smoke-tested with the component's own smoke command. Pinned at the
  # bootstrap floor (v2.88.0): the offline bootstrap reads the blueprint (its
  # one `secrets` reconcile, its background task set-up, its landings checked
  # in the box), and the floor is newer than the API's lane pin (v2.78.4),
  # which is all the lane steps need.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.88.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: e2e — the bootstrapped API builds, deploys (dry) and serves
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          git config --global user.email ci@example.invalid
          git config --global user.name "baseline ci"
          bash testing/e2e.test.sh
